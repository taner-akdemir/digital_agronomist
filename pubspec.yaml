name: milktrace
description: "Milk Trace — hayvan bazında süt verimi takibi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  # Türkçe malzeme metinleri: tarih seçici, "İptal/Tamam", ay adları.
  # Olmadan seçici İngilizce açılıyordu (cihazda bulundu).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Durum yönetimi (§15.2). riverpod_annotation codegen Notifier'lar içindir.
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Ağ. http DEĞİL: interceptor ile token yenileme dio'da daha temiz (§15.2).
  dio: ^5.9.0

  # Depolama: token'lar secure_storage'da; basit ayarlar ve çevrimdışı okuma
  # önbelleği (§18/7, backend ADR 0061) shared_preferences'ta. hive gerekmedi.
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Canlı sağım akışı (§15.2). Yoklama kaldırıldı: backend'in realtime
  # servisi WebSocket sunuyor.
  web_socket_channel: ^3.0.3

  # Push bildirimleri (§15.2).
  #
  # google-services.json HENÜZ YOK: Firebase projesi sonra bağlanacak.
  # Bu yüzden com.google.gms.google-services Gradle eklentisi de EKLENMEDİ —
  # eklenseydi dosya yokken derleme kırılırdı. Paketler derlemeye giriyor ama
  # Firebase çalışma zamanında başlatılamıyor ve uygulama push'suz çalışıyor;
  # PushGateway bunu sessizce yutuyor. Bağlama adımları CLAUDE.md §7'de.
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^20.0.1

  # Sunum
  fl_chart: ^1.2.0            # charts_flutter terk edilmişti, kaldırıldı

  email_validator: ^2.1.17
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Sahte WebSocket kanalı için; yalnızca testlerde kullanılır.
  stream_channel: ^2.1.4
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    # Uygulama içi damla işareti; üretim: tool/brand/generate.sh.
    - assets/brand/

  # Poppins BUNDLE EDİLİR, google_fonts ile çalışma zamanında indirilmez.
  # Ahırda internet zayıftır (§18/7) ve indirme gecikmesi ilk açılışta yazı
  # tipinin sonradan oturmasına yol açar. Lisans: SIL OFL 1.1 (assets/fonts/OFL.txt).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
