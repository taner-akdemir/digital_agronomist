name: milktrace
description: "Milk Trace — hayvan bazında süt verimi takibi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Durum yönetimi (§15.2). riverpod_annotation codegen Notifier'lar içindir.
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Ağ. http DEĞİL: interceptor ile token yenileme dio'da daha temiz (§15.2).
  dio: ^5.9.0

  # Depolama: token'lar secure_storage'da, basit ayarlar shared_preferences'ta.
  # hive KALDIRILDI — gerçek offline önbellek gerekene kadar (§18/7) gereksiz.
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Sunum
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0            # charts_flutter terk edilmişti, kaldırıldı

  email_validator: ^2.1.17
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  web_socket_channel: ^3.0.3
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
