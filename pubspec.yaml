name: milktrace
description: "Milk Trace — hayvan bazında süt verimi takibi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Durum yönetimi (§15.2). riverpod_annotation codegen Notifier'lar içindir.
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Ağ. http DEĞİL: interceptor ile token yenileme dio'da daha temiz (§15.2).
  dio: ^5.9.0

  # Depolama: token'lar secure_storage'da, basit ayarlar shared_preferences'ta.
  # hive KALDIRILDI — gerçek offline önbellek gerekene kadar (§18/7) gereksiz.
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Sunum
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0            # charts_flutter terk edilmişti, kaldırıldı
  linear_progress_bar: ^3.0.0 # TODO(§15.3/16): LinearProgressIndicator'a geçilince kalkacak
  persistent_bottom_nav_bar: ^6.2.1 # TODO(§15.2): go_router + StatefulShellRoute gelince kalkacak

  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
