# Milk Trace — statik analiz ayarları.
#
# Hedef: `flutter analyze` HER COMMIT'te sıfır uyarı (CLAUDE.md §5).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # dynamic'e sessiz geçişleri kapatır. Eski kodda JSON alanları dynamic
    # olarak dolaşıyordu ve `json["targetAmount"] as double` gibi sert
    # cast'ler ancak ÇALIŞMA ZAMANINDA patlıyordu (§15.3/5,6).
    strict-casts: true
    strict-raw-types: true

  errors:
    # Üretilen kodda eksik dönüş tipi uyarısı çıkmasın.
    invalid_annotation_target: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # --- eski kodda gerçekten yaşanmış hatalar ---
    use_build_context_synchronously: true   # async sonrası mounted kontrolü (§15.3/10)
    cancel_subscriptions: true              # WebSocket aboneliği sızmasın
    close_sinks: true
    avoid_slow_async_io: true

    # --- okunabilirlik ---
    always_declare_return_types: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unnecessary_parenthesis: true
    directives_ordering: true
    sort_child_properties_last: true

    # --- yapı ---
    avoid_print: true                       # debugPrint artıkları geri gelmesin
    prefer_const_constructors: true
    prefer_const_declarations: true
    use_super_parameters: true
