# Arayüz metinleri (backend ADR 0093). Kaynak lib/l10n/parts/*_{tr,en}.arb;
# app_tr.arb ve app_en.arb tool/l10n/merge.dart ile ÜRETİLİR, elle düzenlenmez.
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: build/l10n_untranslated.json
